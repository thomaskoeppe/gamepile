name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, so newly disclosed advisories surface without a push.
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so a secret introduced in an earlier commit is still found.
          fetch-depth: 0

      # The binary is used directly rather than gitleaks-action, which requires a
      # paid licence key for organisation-owned repositories.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.0
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Scan repository history
        run: gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1

      - name: Scan working tree
        run: gitleaks dir --config .gitleaks.toml --redact --verbose --exit-code 1

  codeql:
    name: CodeQL
    # Requires CodeQL *default setup* to stay disabled for this repository
    # (Settings -> Code security -> Code scanning -> CodeQL analysis). GitHub
    # rejects SARIF from an advanced configuration while default setup is on:
    # "CodeQL analyses from advanced configurations cannot be processed when
    # the default setup is enabled". This workflow is the advanced config, so
    # it owns the query suite (security-and-quality) and the schedule.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Reported, not enforced. The repository currently carries 14 high-severity
      # advisories in production dependencies (next, sharp, postcss and others)
      # that predate this pipeline; gating on them would block every PR from day
      # one. dependency-review below still blocks *newly introduced* high
      # advisories, so the debt cannot grow while it is being paid down.
      # Once `npm audit --omit=dev --audit-level=high` exits clean, drop
      # continue-on-error to turn this into a gate.
      - name: Audit production dependencies
        id: audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Summarise audit
        if: always()
        run: |
          {
            echo "### Dependency audit"
            echo ""
            if [ "${{ steps.audit.outcome }}" = "success" ]; then
              echo "No high-severity advisories in production dependencies."
            else
              echo "High-severity advisories found in production dependencies:"
              echo ""
              echo '```'
              npm audit --omit=dev 2>&1 | tail -40 || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  dependency-review:
    name: Dependency review
    # Only meaningful on a pull request, where there is a base to diff against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
