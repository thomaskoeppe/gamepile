name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: ESLint
        run: npm run lint

      # Reported, not enforced: knip currently flags pre-existing unused files,
      # exports and dependency-manifest gaps that predate this pipeline. Fix the
      # backlog first, then drop continue-on-error to make it a gate.
      - name: Unused files, exports and dependencies
        continue-on-error: true
        run: npm run knip

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Prettier needs no Prisma client, so this job skips the heavier setup.
      - name: Install dependencies
        run: npm ci

      - name: Prettier
        run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Typecheck web
        run: npx tsc --noEmit -p packages/web/tsconfig.json

      - name: Typecheck shared
        run: npx tsc --noEmit -p packages/shared/tsconfig.json

      - name: Typecheck worker
        run: npm run typecheck --workspace=packages/worker

  test:
    name: Test & coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - name: Summarise coverage
        if: always()
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "No coverage summary produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Coverage"
            echo ""
            echo "| Metric | % | Covered / Total |"
            echo "| --- | --: | --: |"
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              for (const k of ["statements", "branches", "functions", "lines"]) {
                const m = t[k];
                console.log(`| ${k} | ${m.pct}% | ${m.covered} / ${m.total} |`);
              }
            '
          } >> "$GITHUB_STEP_SUMMARY"

  # Feeds the README coverage badges. The numbers are published as shields.io
  # endpoints on an orphan `badges` branch rather than to a third-party service,
  # so no account or extra secret is involved. The branch holds nothing but the
  # badge payloads and is force-pushed each time, so its history is disposable.
  coverage-badge:
    name: Coverage badges
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage

      - name: Publish badge endpoints
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mkdir badge && cd badge
          node -e '
            const { total } = require("../coverage/coverage-summary.json");
            const fs = require("node:fs");
            for (const metric of ["statements", "branches", "functions", "lines"]) {
              const pct = total[metric].pct;
              const color =
                pct >= 90 ? "brightgreen" :
                pct >= 80 ? "green" :
                pct >= 70 ? "yellowgreen" :
                pct >= 60 ? "yellow" :
                pct >= 40 ? "orange" : "red";
              fs.writeFileSync(
                `coverage-${metric}.json`,
                JSON.stringify({ schemaVersion: 1, label: metric, message: `${pct}%`, color }),
              );
            }
          '

          git init -q -b badges
          git add coverage-*.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "chore(badges): coverage for ${GITHUB_SHA} [skip ci]"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Building the web app in CI is what catches a runtime break before it is
      # published as an image — previously only the worker was built here.
      - name: Build web
        run: npm run build --workspace=packages/web
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          WEB_APP_URL: http://localhost:3000

      - name: Build worker
        run: npm run build --workspace=packages/worker
